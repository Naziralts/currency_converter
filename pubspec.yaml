name: currency_converter
description: Currency Converter with Clean Architecture + BLoC
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # DI
  get_it: ^8.2.0

  # Network
  dio: ^5.9.0

  # Local storage
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3

  # Utils
  intl: ^0.20.2
  path: ^1.9.1

  # Charts
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # TEST
  integration_test:
    sdk: flutter

  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true